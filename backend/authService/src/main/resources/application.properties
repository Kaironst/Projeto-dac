spring.application.name=authService

spring.mongodb.uri=mongodb://auth-database:27017/auth_database
spring.data.mongodb.auto-index-creation=true

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=usuario
spring.rabbitmq.password=admin

auth.jwt.secret=${AUTH_JWT_SECRET:bantads-dev-secret-change-me}
auth.jwt.expiration-seconds=${AUTH_JWT_EXPIRATION_SECONDS:3600}

services:
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" #porta para o webapp de gerenciamento
    environment:
      RABBITMQ_DEFAULT_USER: usuario
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  debezium:
    image: quay.io/debezium/server
    container_name: debezium
    volumes:
      - ./debezium/config:/debezium/config:readonly
      - ./debezium/data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      users-database:
        condition: service_started
      cqrs-service:
        condition: service_started

  auth-database:
    image: mongo
    container_name: auth-database
    ports:
      - "1502:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: usuario
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: auth_database

    volumes:
      - mongodb_data:/data/db

  users-database:
    image: postgres
    container_name: users-database
    ports:
      - "1501:5432"

    environment:
      POSTGRES_DB: users_database
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: admin
      PGDATA: /var/lib/postgresql/data
    command: ["postgres", "-c", "wal_level=logical"]

    volumes:
      - pgdata:/var/lib/postgresql/data

  api-gateway-service-node:
    build:
      context: ..
      dockerfile: docker/node-build.dockerfile
      args:
        PROJECT_DIR: apiGatewayServiceNode
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
      - EMAIL_SERVICE_URL=http://email-service:3005
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}

  auth-service:
    build:
      context: ..
      dockerfile: docker/spring-boot-service.dockerfile
      args:
        PROJECT_DIR: authService
    restart: always
    volumes:
      - gradle-caches:/home/gradle/.gradle/caches
      - gradle-wrapper:/home/gradle/.gradle/wrapper
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-database:
        condition: service_started
      users-service:
        condition: service_started
      gerentes-service:
        condition: service_started

    ports:
      - "8085:8080"
    environment:
      - GRADLE_OPTS=-Xmx512m -Xms256m -XX:+HeapDumpOnOutOfMemoryError
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}

  email-service:
    build:
      context: ..
      dockerfile: docker/spring-boot-service.dockerfile
      args:
        PROJECT_DIR: mailService
    depends_on:
      - rabbitmq
    ports:
      - "3006:3005"
    environment:
      - PORT=3005

    env_file:
      - .env.mail

  cqrs-service:
    build:
      context: ..
      dockerfile: docker/spring-boot-service.dockerfile
      args:
        PROJECT_DIR: cqrsService
    restart: always
    volumes:
      - gradle-caches:/home/gradle/.gradle/caches
      - gradle-wrapper:/home/gradle/.gradle/wrapper
    depends_on:
      rabbitmq:
        condition: service_healthy
      users-database:
        condition: service_started
    ports:
      - "8086:8080"
    environment:
      - GRADLE_OPTS=-Xmx512m -Xms256m -XX:+HeapDumpOnOutOfMemoryError

  users-service:
    build:
      context: ..
      dockerfile: docker/spring-boot-service.dockerfile
      args:
        PROJECT_DIR: usersService
    restart: always
    volumes:
      - gradle-caches:/home/gradle/.gradle/caches
      - gradle-wrapper:/home/gradle/.gradle/wrapper
    depends_on:
      rabbitmq:
        condition: service_healthy
      users-database:
        condition: service_started
    ports:
      - "8082:8080"
    environment:
      - GRADLE_OPTS=-Xmx512m -Xms256m -XX:+HeapDumpOnOutOfMemoryError

  contas-service:
    build:
      context: ..
      dockerfile: docker/spring-boot-service.dockerfile
      args:
        PROJECT_DIR: contasService
    restart: always
    volumes:
      - gradle-caches:/home/gradle/.gradle/caches
      - gradle-wrapper:/home/gradle/.gradle/wrapper
    depends_on:
      users-service:
        condition: service_started
      gerentes-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8084:8080"
    environment:
      - GRADLE_OPTS=-Xmx512m -Xms256m -XX:+HeapDumpOnOutOfMemoryError

  gerentes-service:
    build:
      context: ..
      dockerfile: docker/spring-boot-service.dockerfile
      args:
        PROJECT_DIR: gerentesService
    restart: always
    volumes:
      - gradle-caches:/home/gradle/.gradle/caches
      - gradle-wrapper:/home/gradle/.gradle/wrapper
    depends_on:
      users-database:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8083:8080"
    environment:
      - GRADLE_OPTS=-Xmx512m -Xms256m -XX:+HeapDumpOnOutOfMemoryError

  orchestrator-service:
    build:
      context: ..
      dockerfile: docker/spring-boot-service.dockerfile
      args:
        PROJECT_DIR: orchestratorService
    restart: always
    volumes:
      - gradle-caches:/home/gradle/.gradle/caches
      - gradle-wrapper:/home/gradle/.gradle/wrapper
    depends_on:
      contas-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      - GRADLE_OPTS=-Xmx512m -Xms256m -XX:+HeapDumpOnOutOfMemoryError

volumes:
  pgdata:
  mongodb_data:
  rabbitmq_data:
  gradle-caches:
  gradle-wrapper:

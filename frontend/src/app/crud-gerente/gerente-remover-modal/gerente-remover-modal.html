@if (aberto) {
  <div class="modal-backdrop" (click)="onCancelar()">

    <div class="confirm-modal" (click)="impedirFechamento($event)">

      <div class="modal-header danger">
        <h1>Remover Gerente</h1>

        <p>
          Esta ação não poderá ser desfeita.
        </p>
      </div>

      <div class="confirm-card">

        <div class="confirm-icon">
          <span class="material-icons">
            warning
          </span>
        </div>

        <div class="confirm-content">
          <h2>Confirmação</h2>

          <p>
            Tem certeza que deseja remover o gerente
            <strong>{{ gerenteNome }}</strong>?
          </p>
        </div>

        <div class="actions">
          <button
            type="button"
            class="btn-cancelar"
            (click)="onCancelar()"
          >
            Cancelar
          </button>

          <button
            type="button"
            class="btn-remover"
            (click)="onConfirmar()"
          >
            Remover
          </button>
        </div>

      </div>
    </div>
  </div>
}

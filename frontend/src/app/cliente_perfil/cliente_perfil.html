<div class="cliente-container">

  <div class="header">
    <h1>Tela do Cliente</h1>
    <p>Gerencie suas informações pessoais e endereço</p>
  </div>

  <form [formGroup]="perfilForm" (ngSubmit)="atualizarPerfil()">

    <div class="perfil-card">

      <div class="section-title">
        <h2>Perfil do Cliente</h2>
      </div>

      <div class="form-grid">

        <div class="form-group">
          <label>Número da Conta</label>
          <input type="text" [value]="numConta" disabled/>
        </div>

        <div class="form-group">
          <label>Nome</label>
          <input type="text" formControlName="nome"/>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email"/>
        </div>

        <div class="form-group">
          <label>Telefone</label>
          <input type="text" formControlName="telefone" mask="(99) 99999-9999"/>
        </div>

        <div class="form-group">
          <label>CPF</label>
          <input type="text" [value]="cpf" disabled/>
        </div>

        <div class="form-group">
          <label>Salário</label>
          <input type="number" formControlName="salario" />
        </div>

        <div class="form-group">
          <label>Gerente</label>
          <input type="text" [value]="gerente" disabled/>
        </div>

      </div>

      <div class="section-title endereco">
        <h2>Endereço</h2>
      </div>

      <div class="form-grid">

        <div class="form-group">
          <label>CEP</label>
          <input type="text" formControlName="cep" mask="00000-000"/>
          <span class="field-error" *ngIf="perfilForm.get('cep')?.hasError('cepNaoEncontrado')">
            CEP não encontrado
          </span>
        </div>

        <div class="form-group">
          <label>Logradouro</label>
          <input type="text" formControlName="logradouro"/>
        </div>

        <div class="form-group">
          <label>Número</label>
          <input type="text" formControlName="numero"/>
        </div>

        <div class="form-group">
          <label>Complemento</label>
          <input type="text" formControlName="complemento"/>
        </div>

        <div class="form-group">
          <label>Cidade</label>
          <input type="text" formControlName="cidade"/>
        </div>

        <div class="form-group">
          <label>Estado</label>
          <select formControlName="estado">
            <option value="">Selecione</option>
            @for (estado of ufs; track estado.uf) {
              <option [value]="estado.uf">{{ estado.uf }} - {{ estado.nome }}</option>
            }
          </select>
        </div>
      </div>

      <button type="submit" class="btn-salvar">
        Atualizar Perfil
      </button>

    </div>
  </form>
</div>

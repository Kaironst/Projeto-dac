<form method="POST" [formGroup]="formGroup" (ngSubmit)="login()" class="login-form">
  <mat-card class="login-card" appearance="outlined">

    <mat-card-header class="card-header">
      <mat-card-title class="login-title">Login</mat-card-title>
    </mat-card-header>

    <mat-card-content class="card-content">

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input type="email" matInput formControlName="email" placeholder="cliente@bantads.com">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input type="password" matInput formControlName="senha" placeholder="Sua senha">
        </mat-form-field>
      </div>

    </mat-card-content>

    <mat-card-actions class="card-actions">
      <button type="submit" mat-flat-button color="primary" class="submit-button" [disabled]="!formGroup.valid">Realizar Login</button>
      <button type="button" mat-button color="warn" class="voltar-button" (click)="voltar()">Voltar</button>
    </mat-card-actions>

  </mat-card>
</form>

@if (mostrarMensagemSucesso) {
  <div class="success-backdrop" (click)="fecharMensagemSucesso()">
    <mat-card class="success-card" appearance="outlined" (click)="$event.stopPropagation()">
      <mat-card-content class="success-content">
        <h2>Login realizado com sucesso</h2>
        <p>Acesso validado pelo backend. Você será direcionado para a área correspondente.</p>
      </mat-card-content>

      <mat-card-actions class="success-actions">
        <button type="button" mat-flat-button color="primary" (click)="fecharMensagemSucesso()">OK</button>
      </mat-card-actions>
    </mat-card>
  </div>
}

@if (mostrarMensagemErro) {
  <div class="success-backdrop" (click)="fecharMensagemErro()">
    <mat-card class="success-card" appearance="outlined" (click)="$event.stopPropagation()">
      <mat-card-content class="success-content">
        <h2>Não foi possível realizar login</h2>
        <p>{{ mensagemErro }}</p>
      </mat-card-content>

      <mat-card-actions class="success-actions">
        <button type="button" mat-flat-button color="warn" (click)="fecharMensagemErro()">OK</button>
      </mat-card-actions>
    </mat-card>
  </div>
}
